<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Gestão Lello</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .login-box { background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        .btn-lello { background-color: #00a7e1; color: #ffffff; font-weight: 600; font-size: 1rem; padding: 12px; border: none; border-radius: 6px; width: 100%; transition: all 0.2s; }
        .btn-lello:hover { background-color: #008ec2; }
    </style>
</head>
<body>
    <div class="login-box text-center">
        <h4 class="fw-bold mb-1" style="color: #0f172a;">Portal de Cobranças</h4>
        <p class="text-muted small mb-4">Autenticação de Colaborador</p>
        
        <form action="/login" method="POST">
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold text-secondary">Identifique-se para acessar o sistema:</label>
                <select name="usuario" class="form-select form-select-lg" required style="font-size: 0.95rem;">
                    <option value="" disabled selected>Selecione seu nome...</option>
                    <option value="Alessandra">Alessandra</option>
                    <option value="Arthur">Arthur</option>
                    <option value="Ellen">Ellen</option>
                    <option value="Geovanna">Geovanna</option>
                    <option value="Gisele">Gisele</option>
                    <option value="Heloisa">Heloisa</option>
                    <option value="Jéssica">Jessica</option>
                    <option value="João">João</option>
                    <option value="Marcio">Marcio</option>
                    <option value="Paulo">Paulo</option>
                    <option value="Ryan">Ryan</option>
                    <option value="Victor">Victor</option>
                </select>
            </div>
            <button type="submit" class="btn-lello">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
